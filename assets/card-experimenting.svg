<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190" viewBox="0 0 340 190" role="img" aria-labelledby="title desc">
  <title id="title">Always experimenting</title><desc id="desc">Try an idea, see what happens, and keep learning along the way.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18233e"/><stop offset="1" stop-color="#123039"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#70f0d0"/><stop offset="1" stop-color="#78a9ff"/></linearGradient><style>.spark{animation:blink 2s ease-in-out infinite}.s2{animation-delay:.7s}.s3{animation-delay:1.3s}@keyframes blink{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.spark{animation:none}}</style></defs>
  <rect width="340" height="190" rx="20" fill="url(#bg)" stroke="#78a9ff" stroke-opacity=".28"/><path d="M268 32l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="url(#a)" opacity=".55"/><circle class="spark" cx="304" cy="98" r="4" fill="#70f0d0"/><circle class="spark s2" cx="255" cy="112" r="3" fill="#d38aff"/><circle class="spark s3" cx="294" cy="39" r="3" fill="#78a9ff"/>
  <text x="23" y="42" fill="#78a9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">05 / THE EXPLORATION</text><text x="23" y="100" fill="#f5f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Always experimenting</text><text x="23" y="130" fill="#c5cce2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Try an idea, see what happens,</text><text x="23" y="151" fill="#c5cce2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">and learn something along the way.</text>
</svg>
