<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190" viewBox="0 0 340 190" role="img" aria-labelledby="title desc">
  <title id="title">Better together</title><desc id="desc">Collaboration, kind feedback, and fresh perspectives help good ideas grow.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21183b"/><stop offset="1" stop-color="#17243b"/></linearGradient><style>.bubble{animation:bob 3s ease-in-out infinite}.delay{animation-delay:1s}@keyframes bob{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.bubble{animation:none}}</style></defs>
  <rect width="340" height="190" rx="20" fill="url(#bg)" stroke="#d38aff" stroke-opacity=".27"/><g class="bubble"><circle cx="269" cy="55" r="23" fill="#d38aff" opacity=".17" stroke="#d38aff"/><circle cx="298" cy="79" r="15" fill="#78a9ff" opacity=".22" stroke="#78a9ff"/></g><g class="bubble delay"><circle cx="240" cy="88" r="12" fill="#70f0d0" opacity=".35"/></g>
  <text x="23" y="42" fill="#d38aff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">04 / THE PEOPLE</text><text x="23" y="100" fill="#f5f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Better together</text><text x="23" y="130" fill="#c5cce2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Fresh perspectives and kind</text><text x="23" y="151" fill="#c5cce2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">feedback help ideas grow.</text>
</svg>
